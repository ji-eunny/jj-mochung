<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1200" viewBox="0 0 1200 1200"
     fill="none">
  <defs>
    <!-- 손으로 그린 듯한 미세한 흔들림 -->
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.006 0.018"
        numOctaves="2"
        seed="13"
        result="noise"/>
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="2.2"
        xChannelSelector="R"
        yChannelSelector="G"/>
    </filter>

    <!-- 필름 몸체에서 중앙 사진 영역과 구멍을 제거 -->
    <mask id="filmMask">
      <rect width="1200" height="1200" fill="black"/>

      <!-- 필름 전체 -->
      <rect x="62" y="62" width="1076" height="1076" rx="18" fill="white"/>

      <!-- 사진이 들어갈 큰 투명 영역 -->
      <rect x="78" y="114" width="1044" height="972" rx="18" fill="black"/>

      <!-- 위쪽 스프로킷 홀 -->
      <g fill="black">
        <rect x="82" y="76" width="27" height="27" rx="6"/>
        <rect x="131" y="76" width="27" height="27" rx="6"/>
        <rect x="180" y="76" width="27" height="27" rx="6"/>
        <rect x="229" y="76" width="27" height="27" rx="6"/>
        <rect x="278" y="76" width="27" height="27" rx="6"/>
        <rect x="327" y="76" width="27" height="27" rx="6"/>
        <rect x="376" y="76" width="27" height="27" rx="6"/>
        <rect x="425" y="76" width="27" height="27" rx="6"/>
        <rect x="474" y="76" width="27" height="27" rx="6"/>
        <rect x="523" y="76" width="27" height="27" rx="6"/>
        <rect x="572" y="76" width="27" height="27" rx="6"/>
        <rect x="621" y="76" width="27" height="27" rx="6"/>
        <rect x="670" y="76" width="27" height="27" rx="6"/>
        <rect x="719" y="76" width="27" height="27" rx="6"/>
        <rect x="768" y="76" width="27" height="27" rx="6"/>
        <rect x="817" y="76" width="27" height="27" rx="6"/>
        <rect x="866" y="76" width="27" height="27" rx="6"/>
        <rect x="915" y="76" width="27" height="27" rx="6"/>
        <rect x="964" y="76" width="27" height="27" rx="6"/>
        <rect x="1013" y="76" width="27" height="27" rx="6"/>
        <rect x="1062" y="76" width="27" height="27" rx="6"/>
      </g>

      <!-- 아래쪽 스프로킷 홀 -->
      <g fill="black">
        <rect x="82" y="1097" width="27" height="27" rx="6"/>
        <rect x="131" y="1097" width="27" height="27" rx="6"/>
        <rect x="180" y="1097" width="27" height="27" rx="6"/>
        <rect x="229" y="1097" width="27" height="27" rx="6"/>
        <rect x="278" y="1097" width="27" height="27" rx="6"/>
        <rect x="327" y="1097" width="27" height="27" rx="6"/>
        <rect x="376" y="1097" width="27" height="27" rx="6"/>
        <rect x="425" y="1097" width="27" height="27" rx="6"/>
        <rect x="474" y="1097" width="27" height="27" rx="6"/>
        <rect x="523" y="1097" width="27" height="27" rx="6"/>
        <rect x="572" y="1097" width="27" height="27" rx="6"/>
        <rect x="621" y="1097" width="27" height="27" rx="6"/>
        <rect x="670" y="1097" width="27" height="27" rx="6"/>
        <rect x="719" y="1097" width="27" height="27" rx="6"/>
        <rect x="768" y="1097" width="27" height="27" rx="6"/>
        <rect x="817" y="1097" width="27" height="27" rx="6"/>
        <rect x="866" y="1097" width="27" height="27" rx="6"/>
        <rect x="915" y="1097" width="27" height="27" rx="6"/>
        <rect x="964" y="1097" width="27" height="27" rx="6"/>
        <rect x="1013" y="1097" width="27" height="27" rx="6"/>
        <rect x="1062" y="1097" width="27" height="27" rx="6"/>
      </g>
    </mask>
  </defs>

  <!-- 배경 완전 투명 -->
  <g filter="url(#rough)">
    <rect x="62" y="62" width="1076" height="1076" rx="18"
          fill="#746D67"
          mask="url(#filmMask)"/>
  </g>
</svg>
